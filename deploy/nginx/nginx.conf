# nginx reverse proxy for auth.kicon.com — TLS termination + security headers,
# load-balancing across the two app instances. The IdP trusts X-Forwarded-* (it
# sets provider.proxy = true), so the issuer and cookies resolve to https.

worker_processes auto;
events { worker_connections 1024; }

http {
  # Round-robin across the two app containers (Docker DNS resolves the names).
  upstream idp_app {
    server app1:3000;
    server app2:3000;
    keepalive 32;
  }

  # Basic rate limit at the edge (app-level throttling is the real control).
  limit_req_zone $binary_remote_addr zone=idp:10m rate=20r/s;

  # --- HTTP: redirect to HTTPS, but serve ACME http-01 challenges ---
  server {
    listen 80;
    server_name auth.kicon.com;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      return 301 https://$host$request_uri;
    }
  }

  # --- HTTPS: the real IdP surface ---
  server {
    listen 443 ssl;
    http2 on;
    server_name auth.kicon.com;

    ssl_certificate     /etc/letsencrypt/live/auth.kicon.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.kicon.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers. HSTS is safe here because the IdP is https-only.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;               # login page must not be framed
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'none'; style-src 'unsafe-inline'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    client_max_body_size 64k; # auth requests are small
    limit_req zone=idp burst=40 nodelay;

    location / {
      proxy_pass http://idp_app;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-Host $host;
      proxy_read_timeout 30s;
    }
  }
}
